# Continuous Deployment — build the production image and publish it to the
# GitHub Container Registry (GHCR) automatically.
#
# WHY THIS IS "CD":
#   CI (ci.yml) proves the code is good. This workflow takes the NEXT step —
#   it packages that good code into a versioned Docker image and publishes it,
#   with zero manual `docker build` / `docker push`. Anyone (or any server) can
#   then pull `ghcr.io/<owner>/<repo>:latest` and run it.
#
# CD RUNS AFTER *BOTH* QUALITY GATES (not in parallel):
#   The `workflow_run` trigger waits for the "CI Pipeline" workflow to finish on
#   main. But CI alone is not enough — the "AI Eval Quality Gate" must ALSO have
#   passed for the same commit, otherwise we could publish an image whose AI
#   answer quality has regressed.
#
#   GitHub Actions has no native "wait for two workflows": listing both names in
#   `workflow_run` fires this workflow TWICE (one event per workflow that
#   completes). So instead we keep the single CI trigger and then explicitly
#   query the GitHub API for the eval workflow's conclusion on the same commit
#   SHA (see the `verify-gates` job below).
#
#   Normal CI-triggered order: CI + Eval → build once → container smoke → push.
#   Container checks run on every publishing path, including tag/manual runs.
#
# NO EXTERNAL ACCOUNTS NEEDED:
#   GHCR is part of GitHub. The built-in GITHUB_TOKEN (with packages: write) is
#   enough to push — no Docker Hub login, no cloud credentials required.

name: CD - Publish Image

on:
  # Run after the CI Pipeline completes on main.
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]
  # Also allow publishing from a version tag (e.g. v1.0.0) and manual runs.
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write          # required to push to GHCR
  actions: read            # required to read the eval workflow's run status

env:
  EVAL_WORKFLOW_NAME: AI Eval Quality Gate

jobs:
  # ---------------------------------------------------------------------------
  # Gate 2: confirm the AI Eval Quality Gate also succeeded for this commit.
  #
  # `workflow_run` only tells us CI passed. This job looks up the eval workflow's
  # run for the SAME commit SHA and fails if it did not succeed, so a quality
  # regression blocks publishing. For tag / manual runs there is no triggering
  # commit from CI, so the check is skipped (see the `if` below).
  # ---------------------------------------------------------------------------
  verify-gates:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Verify AI Eval Quality Gate passed for this commit
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo "Checking '$EVAL_WORKFLOW_NAME' for commit $HEAD_SHA"

          # Poll because CI and the eval gate run in parallel — the eval run may
          # still be in progress when CI finishes.
          for attempt in $(seq 1 30); do
            runs=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=100" \
              --jq "[.workflow_runs[] | select(.name == \"${EVAL_WORKFLOW_NAME}\")]")

            count=$(echo "$runs" | jq 'length')
            if [ "$count" -eq 0 ]; then
              echo "::error::No '$EVAL_WORKFLOW_NAME' run found for commit $HEAD_SHA"
              exit 1
            fi

            # Most recent run for this SHA.
            status=$(echo "$runs" | jq -r 'sort_by(.created_at) | last | .status')
            conclusion=$(echo "$runs" | jq -r 'sort_by(.created_at) | last | .conclusion')
            echo "attempt ${attempt}/30 — status=${status} conclusion=${conclusion}"

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "✅ '$EVAL_WORKFLOW_NAME' passed — proceeding to publish."
                exit 0
              fi
              echo "::error::'$EVAL_WORKFLOW_NAME' concluded '${conclusion}' — refusing to publish."
              exit 1
            fi

            sleep 20
          done

          echo "::error::Timed out waiting for '$EVAL_WORKFLOW_NAME' to complete."
          exit 1

  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify-gates      # only publish once BOTH gates are green
    steps:
      # Check out the exact commit that passed CI + the eval gate. Without this,
      # a workflow_run-triggered checkout defaults to the branch head, which may
      # already have newer, unverified commits.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read checked-out commit
        id: source
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:7}" >> "$GITHUB_OUTPUT"

      # Derives the lowercase image name and a sensible set of tags/labels.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          context: workflow
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=sha-${{ steps.source.outputs.short_sha }},priority=100
            type=ref,event=tag
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}

      - name: Build candidate image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start candidate container
        id: container
        env:
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: docker run --detach --name ai-logistics-smoke --publish 127.0.0.1:8000:8000 "$IMAGE_ID"

      - name: Verify packaged health endpoint and UI
        run: |
          python3 - <<'PY'
          import json
          import time
          from urllib.error import URLError
          from urllib.request import urlopen

          base_url = "http://127.0.0.1:8000"
          for attempt in range(60):
              try:
                  with urlopen(f"{base_url}/api/health", timeout=5) as response:
                      assert response.status == 200
                      assert json.load(response).get("status") == "healthy"
                  break
              except (URLError, TimeoutError) as exc:
                  print(f"Waiting for startup ({attempt + 1}/60): {exc}", flush=True)
                  time.sleep(2)
          else:
              raise RuntimeError("Container did not become healthy")

          with urlopen(base_url, timeout=5) as response:
              assert response.status == 200
              assert response.headers.get_content_type() == "text/html", "Root did not serve HTML"
              html = response.read().decode("utf-8")
              assert "<title>AI Logistics Assistant</title>" in html, "Application UI missing"

          print("Container health and packaged UI checks passed")
          PY

      - name: Show container logs
        if: always() && steps.container.outcome == 'success'
        run: docker logs ai-logistics-smoke

      - name: Remove test container
        if: always() && steps.container.outcome == 'success'
        run: docker rm --force ai-logistics-smoke

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          TESTED_IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_TAGS"
          while IFS= read -r tag; do
            actual_id=$(docker image inspect --format '{{.Id}}' "$tag")
            if [ "$actual_id" != "$TESTED_IMAGE_ID" ]; then
              echo "::error::Tag $tag does not reference the tested image"
              exit 1
            fi
          done <<< "$IMAGE_TAGS"
          while IFS= read -r tag; do
            docker push "$tag"
          done <<< "$IMAGE_TAGS"

      - name: Summary
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "### Tested image published :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pull with:" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r tag; do
            echo "docker pull $tag" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$IMAGE_TAGS"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # OPTIONAL — Deploy the published image to a real host.
  # This is left as a template because it needs a target + its secret. Pick ONE,
  # add the secret in GitHub → Settings → Secrets, then uncomment.
  #
  # Example: deploy to a server over SSH that runs `docker compose`:
  #
  # deploy:
  #   needs: build-and-push
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Deploy over SSH
  #       uses: appleboy/ssh-action@v1
  #       with:
  #         host: ${{ secrets.DEPLOY_HOST }}
  #         username: ${{ secrets.DEPLOY_USER }}
  #         key: ${{ secrets.DEPLOY_SSH_KEY }}
  #         script: |
  #           docker pull ghcr.io/${{ github.repository }}:latest
  #           docker compose -f /opt/app/docker-compose.yml up -d
  # ---------------------------------------------------------------------------
