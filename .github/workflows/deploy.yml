# Continuous Deployment — build the production image and publish it to the
# GitHub Container Registry (GHCR) automatically.
#
# WHY THIS IS "CD":
#   CI (ci.yml) proves the code is good. This workflow takes the NEXT step —
#   it packages that good code into a versioned Docker image and publishes it,
#   with zero manual `docker build` / `docker push`. Anyone (or any server) can
#   then pull `ghcr.io/<owner>/<repo>:latest` and run it.
#
# CD RUNS AFTER CI (not in parallel):
#   The `workflow_run` trigger waits for the "CI Pipeline" workflow to finish on
#   main, and the job only proceeds if CI concluded successfully. So the order is
#   always:  push → CI (lint + tests + coverage) → [success] → CD (build + push).
#
# NO EXTERNAL ACCOUNTS NEEDED:
#   GHCR is part of GitHub. The built-in GITHUB_TOKEN (with packages: write) is
#   enough to push — no Docker Hub login, no cloud credentials required.

name: CD - Publish Image

on:
  # Run after the CI Pipeline completes on main.
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]
  # Also allow publishing from a version tag (e.g. v1.0.0) and manual runs.
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write          # required to push to GHCR

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Gate: when triggered by CI completion, only proceed if CI passed.
    # (push-tag and manual runs don't set workflow_run, so they pass this check.)
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derives the lowercase image name and a sensible set of tags/labels.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Image published :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pull with:" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ghcr.io/${{ github.repository }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # OPTIONAL — Deploy the published image to a real host.
  # This is left as a template because it needs a target + its secret. Pick ONE,
  # add the secret in GitHub → Settings → Secrets, then uncomment.
  #
  # Example: deploy to a server over SSH that runs `docker compose`:
  #
  # deploy:
  #   needs: build-and-push
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Deploy over SSH
  #       uses: appleboy/ssh-action@v1
  #       with:
  #         host: ${{ secrets.DEPLOY_HOST }}
  #         username: ${{ secrets.DEPLOY_USER }}
  #         key: ${{ secrets.DEPLOY_SSH_KEY }}
  #         script: |
  #           docker pull ghcr.io/${{ github.repository }}:latest
  #           docker compose -f /opt/app/docker-compose.yml up -d
  # ---------------------------------------------------------------------------
